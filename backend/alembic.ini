[alembic]
script_location = alembic
# Original Postgres URL (commented to enable SQLite migrations locally)
# sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/aau_db
# SQLite local dev URL
sqlalchemy.url = sqlite+aiosqlite:///./efms.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
